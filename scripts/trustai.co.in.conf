server {
    server_name trustai.co.in www.trustai.co.in;

    root /var/www/trustai.co.in;
    index index.html;

    location / { try_files $uri /index.html; }

    # Common proxy settings as a named location block
    location @backend {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routes that use the backend proxy
    location /api/ {
        try_files $uri @backend;
    }

    location /images/ {
        try_files $uri @backend;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trustai.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trustai.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.trustai.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = trustai.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name trustai.co.in www.trustai.co.in;
    return 404; # managed by Certbot

}

